<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile · SocialApp</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="auth-container">
    <h1>Edit profile</h1>
    <form id="edit-form">
      <div class="form-group">
        <label for="name">Display name</label>
        <input type="text" id="name" maxlength="100">
      </div>
      <div class="form-group">
        <label for="bio">Bio</label>
        <textarea id="bio" rows="3" maxlength="500"></textarea>
      </div>
      <div class="form-group">
        <label for="profileImage">Profile image URL</label>
        <input type="url" id="profileImage" placeholder="https://...">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;" id="submit-btn">Save changes</button>
    </form>
  </div>

  <script type="module" src="/js/pages/edit-profile.js"></script>
</body>
</html>
