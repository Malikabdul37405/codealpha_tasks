<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post · SocialApp</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="container" style="padding-top: 20px; padding-bottom: 40px;">
    <div id="post-container" class="loading">Loading...</div>
    <div class="card mt-4">
      <h3 style="margin-bottom: 12px;">Comments</h3>
      <div id="comments-list"></div>
      <div class="form-group mt-4">
        <textarea id="comment-input" rows="2" placeholder="Add a comment..." maxlength="1000"></textarea>
        <button class="btn btn-primary btn-sm mt-2" id="add-comment-btn">Comment</button>
      </div>
    </div>
  </main>

  <script type="module" src="/js/pages/post.js"></script>
</body>
</html>
