<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed · SocialApp</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="container" style="padding-top: 20px; padding-bottom: 40px;">
    <div class="compose-box" id="compose-box">
      <textarea id="post-content" placeholder="What's happening?" maxlength="2000"></textarea>
      <div class="compose-actions">
        <button class="btn btn-primary" id="create-post-btn">Post</button>
      </div>
    </div>

    <div id="feed-container">
      <div class="loading">Loading posts...</div>
    </div>

    <div class="text-center mt-4">
      <button class="btn btn-outline" id="load-more-btn" style="display: none;">Load more</button>
    </div>
  </main>

  <script type="module" src="/js/pages/home.js"></script>
</body>
</html>
