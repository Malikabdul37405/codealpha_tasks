<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · SocialApp</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="auth-container">
    <h1>Log in</h1>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;" id="submit-btn">Log in</button>
    </form>
    <p class="auth-footer">Don't have an account? <a href="/register.html">Sign up</a></p>
  </div>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
